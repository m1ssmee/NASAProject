name: Check for new SPHEREx data

# Once a day, ask the archive which parts of the sky have the newest exposures and commit the
# result. The commit triggers a redeploy, so the site's "Newly photographed" list stays current.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fresh.mts
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- public/sky/fresh.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/sky/fresh.json
            git commit -m "Update newly photographed fields"
            git push
          fi
